name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js 20 は EOL で CVE-2026-111497（Brotli デコーダ）の修正が入らない。
      # 修正版は 22.23.4 / 24.22.1 / 26.12.1 以降。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # ランナーに同梱の Node は修正版より古いことがある（実際に 24.21.0 だった）ので、
          # 公式配布の最新の 24.x を取得する。下の確認ステップが最終的な門番
          check-latest: true
          cache: "npm"

      - name: Check Node.js version (CVE-2026-111497)
        run: |
          node -e '
            const [maj, min, pat] = process.versions.node.split(".").map(Number);
            const fixed = { 22: [23, 4], 24: [22, 1], 26: [12, 1] }[maj];
            console.log("node " + process.versions.node);
            if (!fixed || min < fixed[0] || (min === fixed[0] && pat < fixed[1])) {
              console.error("Node.js " + process.versions.node + " は CVE-2026-111497 の修正版ではありません");
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
